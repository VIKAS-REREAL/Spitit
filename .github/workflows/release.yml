name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.0.0)"
        required: true
        default: "v3.0.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Format Rust Code
        run: cargo fmt
        working-directory: src-tauri

      - name: Extract Tag Version
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build Tauri Application Bundle
        run: npx @tauri-apps/cli build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Microsoft Store MSIX Package
        shell: pwsh
        run: |
          ./msix/build-msix.ps1 `
            -Version "${{ env.VERSION }}" `
            -PackageName "${{ vars.MS_PACKAGE_NAME || 'VikasNath.Spitit' }}" `
            -Publisher "${{ vars.MS_PUBLISHER || 'CN=0AE03DC8-0A8C-4F03-A557-E8A19893C1E6' }}" `
            -PublisherDisplayName "${{ vars.MS_PUBLISHER_DISPLAY_NAME || 'VikasNath' }}" `
            -OutputDir "release-artifacts"

      - name: Collect & Name Release Artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts

          # Copy NSIS Setup installer with fixed versioned naming
          cp src-tauri/target/release/bundle/nsis/*.exe release-artifacts/Spitit_${{ env.VERSION }}_x64-setup.exe 2>/dev/null || true

          # Copy Portable executable with fixed versioned naming
          cp src-tauri/target/release/spitit-v3.exe release-artifacts/Spitit_${{ env.VERSION }}_portable.exe 2>/dev/null || cp src-tauri/target/release/Spitit.exe release-artifacts/Spitit_${{ env.VERSION }}_portable.exe 2>/dev/null || true

          # Copy install-certificate helper script if present
          cp msix/install-certificate.ps1 release-artifacts/ 2>/dev/null || true

          # Compute SHA-256 Checksums for all release assets
          cd release-artifacts
          sha256sum $(ls -1 Spitit_${{ env.VERSION }}_* 2>/dev/null) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Spitit v${{ env.VERSION }}"
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/Spitit_${{ env.VERSION }}_x64-setup.exe
            release-artifacts/Spitit_${{ env.VERSION }}_portable.exe
            release-artifacts/Spitit_${{ env.VERSION }}_x64.msix
            release-artifacts/Spitit_${{ env.VERSION }}_cert.cer
            release-artifacts/install-certificate.ps1
            release-artifacts/SHA256SUMS.txt
          body: |
            ## Spitit v${{ env.VERSION }}
            
            ### Official Downloads (Windows 10 & 11, 64-bit)
            - **Installer (NSIS Setup - Recommended):** `Spitit_${{ env.VERSION }}_x64-setup.exe`
            - **Standalone Portable:** `Spitit_${{ env.VERSION }}_portable.exe`
            - **Signed MSIX Package:** `Spitit_${{ env.VERSION }}_x64.msix`
            - **Companion Certificate:** `Spitit_${{ env.VERSION }}_cert.cer` *(for MSIX sideloading)*
            - **Certificate Installer:** `install-certificate.ps1`
            - **Checksums:** `SHA256SUMS.txt`
            
            ### Installing the MSIX Package
            - **Via Microsoft Store:** No extra steps required.
            - **Direct Download (Sideloading):**
              1. Right-click `install-certificate.ps1` and choose **Run with PowerShell** (or open `Spitit_${{ env.VERSION }}_cert.cer` -> Install Certificate -> Local Machine -> Trusted Root Certification Authorities).
              2. Double-click `Spitit_${{ env.VERSION }}_x64.msix` to install.
            
            ### Verification
            Verify the integrity of downloaded files with PowerShell:
            ```powershell
            Get-FileHash -Algorithm SHA256 .\Spitit_${{ env.VERSION }}_x64-setup.exe
            ```
            Compare against the published `SHA256SUMS.txt`.
            
            ### Notes
            - See [SECURITY.md](https://github.com/VIKAS-REREAL/Spitit/blob/main/SECURITY.md) for vulnerability reporting.
            - See [TRADEMARK.md](https://github.com/VIKAS-REREAL/Spitit/blob/main/TRADEMARK.md) for brand guidelines.
