name: Continuous Integration & Windows Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
      - "README.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/website.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  lint-test-and-build:
    name: Build & Package Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck & Build Frontend
        run: npm run build

      - name: Format Rust Code
        run: cargo fmt
        working-directory: src-tauri

      - name: Run Clippy Linter
        run: cargo clippy --all-targets
        working-directory: src-tauri

      - name: Run Rust Tests
        run: cargo test
        working-directory: src-tauri

      - name: Build Tauri Windows Executable & Installer
        run: npx @tauri-apps/cli build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Microsoft Store MSIX Package
        shell: pwsh
        run: |
          ./msix/build-msix.ps1 `
            -Version "3.0.0" `
            -PackageName "${{ vars.MS_PACKAGE_NAME || 'Spitit' }}" `
            -Publisher "${{ vars.MS_PUBLISHER || 'CN=Spitit' }}" `
            -PublisherDisplayName "${{ vars.MS_PUBLISHER_DISPLAY_NAME || 'Vikas Nath - REREAL' }}" `
            -DisplayName "Spitit" `
            -OutputDir "build-artifacts"

      - name: Collect Build Artifacts
        shell: bash
        run: |
          mkdir -p build-artifacts
          # Copy NSIS installer
          cp src-tauri/target/release/bundle/nsis/*.exe build-artifacts/Spitit_3.0.0_x64-setup.exe 2>/dev/null || true
          # Copy Standalone portable executable
          cp src-tauri/target/release/spitit-v3.exe build-artifacts/Spitit_3.0.0_portable.exe 2>/dev/null || cp src-tauri/target/release/Spitit.exe build-artifacts/Spitit_3.0.0_portable.exe 2>/dev/null || true
          ls -la build-artifacts/

      - name: Upload Microsoft Store MSIX Package
        uses: actions/upload-artifact@v4
        with:
          name: Spitit_3.0.0_x64_MSIX
          path: build-artifacts/*.msix
          retention-days: 30

      - name: Upload All Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spitit-windows-build-${{ github.sha }}
          path: build-artifacts/*
          retention-days: 14
