name: Feature Request
description: Suggest an idea or enhancement for Spitit
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify that your suggestion aligns with our [Non-Goals](https://github.com/VIKAS-REREAL/Spitit/blob/main/CONTRIBUTING.md#1-project-philosophy--non-goals) (no accounts, no remote telemetry, no conversational AI chatbots).

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
